[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo run` starts the app, as it did before the split. Everything
# else is reached with `-p`, and the gates use `--workspace` so no member is
# skipped (AGENTS.md).
default-members = ["crates/app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# Nothing here goes to crates.io: the crates are one application split into
# layers, and `cargo publish` on any of them would be a mistake rather than a
# step nobody got round to. cargo-release reads this too and skips the publish
# step it would otherwise run before tagging (issue #106).
publish = false

[workspace.dependencies]
kjerag-media = { path = "crates/media" }
kjerag-meta = { path = "crates/meta" }
kjerag-render = { path = "crates/render" }

# The sound out (issue #13). cosmic-player has no audio output code to copy:
# it is GStreamer playbin with only the video sink replaced, and GStreamer is
# already rejected here for the frame path. cpal is the smaller of issue #13's
# two named alternatives, and PipeWire still plays what it writes, through
# pipewire-alsa. Its Linux target links `alsa` whatever host it ends up using,
# which is what adds libasound2-dev to the build requirements (AGENTS.md).
cpal = "0.18"
# The crate major must match the headers it binds, so this pin is a
# statement about which ffmpeg the app is built against, and the answer is
# now 7.1: every freedesktop runtime ships it (`//25.08` is 7.1.3), and the
# Flatpak has no way to build against anything else (issue #65). Ubuntu
# 24.04's own 6.1 is therefore no longer enough; AGENTS.md says where the
# dev box gets 7.1 from.
# `kjerag-meta` is deliberately not a dependent: the trailer needs a file
# handle, not libav (issue #19).
ffmpeg-next = "7.1"
# libcosmic vendors iced as a submodule pinned to wgpu 28, and wgpu types
# only unify across one major: this pin IS libcosmic's pin, not a choice.
wgpu = "28.0"
# The dmabuf import is hand-rolled against raw Vulkan on wgpu 28, so the
# ash major must be the one wgpu-hal 28 links.
ash = "0.38"
# Resolves the XDG user directories, which is where a still goes. Already in
# the tree through libcosmic, and the crate the COSMIC screenshot portal
# itself asks for the folder we write into.
dirs = "6.0"
# Encodes a saved still (issue #15). Pure Rust, no C library and no system
# package; its `simd` feature is what keeps the encode near the PNG it
# replaces, measured over a real 3840x2160 capture: 105 ms without it, 70 ms
# with.
jpeg-encoder = { version = "0.6", features = ["simd"] }
libc = "0.2"
# Hands a URL to the desktop, for the About page's links. cosmic-edit and
# cosmic-files both open theirs with this crate.
open = "5"
png = "0.17"
pollster = "0.4"
# Decodes the .insv trailer's metadata record. Only the eleven fields
# kjerag-meta declares are read; protobuf skips the rest.
prost = "0.14"
# Derives the app's two cosmic-config entries, and reads the checked-in
# calibration fixture that telemetry-parser wrote as JSON.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Only the timer, and only for the toast dismissal: libcosmic's default
# features already bring tokio in as the app's executor.
tokio = { version = "1", default-features = false, features = ["time"] }
# The portal file chooser answers in URLs, and a drop's `text/uri-list` is
# URLs too. Everything past the edge of the shell is a `PathBuf` (docs/UI.md).
url = "2"

[workspace.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "dc1cf9f00cbe2902a52166492654bb9fee8a73d1"
# wgpu is not a default feature: the default renderer is tiny-skia, which
# has no shader widget and no device to import into.
features = ["wgpu"]

# wgpu-hal 28 enables VK_KHR_external_memory_fd and
# VK_EXT_external_memory_dma_buf but never VK_EXT_image_drm_format_modifier,
# and iced_wgpu builds its device from a fixed DeviceDescriptor with no hook,
# so the device the shader widget renders on cannot import a tiled dmabuf.
# This commit is the extension-enable hunk of gfx-rs/wgpu#9366 (shipped in
# wgpu 30) applied verbatim to the v28.0.1 tag, and nothing else. Delete this
# entry and the fork the day libcosmic reaches wgpu 30.
#
# The entry names `wgpu` even though the change is in `wgpu-hal`: patching
# wgpu-hal alone leaves the rest of the tree on the crates.io wgpu-types,
# and two wgpu-types in one graph is two incompatible `TextureFormat`s.
# `wgpu` is the only crate in that workspace anything outside it depends on,
# so patching it pulls the whole stack from one consistent source.
#
# Cargo reads a patch section only from the workspace root, so no member
# manifest may carry one.
#
# Pinned by `rev`, not by `branch` (issue #68). Either way Cargo.lock records
# the one commit, and so does every offline build recipe derived from it:
# `cargo vendor` and flatpak/cargo-sources.json both fetch it by hash. A
# branch name is the part that can move: force-push the fork and every
# recorded build breaks at fetch time, a published Flatpak's rebuild
# included. The rev below is the tip of `v28-drm-modifier-backport`, which
# stays on the fork as the readable name for it.
[patch.crates-io]
wgpu = { git = "https://github.com/aeharding/wgpu", rev = "fb66f36c5cf1135c11523767652ea7a809b3e598" }
