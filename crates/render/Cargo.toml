[package]
name = "kyerag-render"
version.workspace = true
edition.workspace = true

[dependencies]
kyerag-media = { workspace = true }
# The per-lens Mei calibration the reprojection pass runs on. This is the
# only edge into `kyerag-meta` in the graph; the trailer layer itself still
# depends on nothing but prost, which is what its ffmpeg-free CI job checks.
kyerag-meta = { workspace = true }
ash = { workspace = true }
# Where the per-file seam fit is remembered (`src/seam.rs`): the XDG cache
# directory, which is where cosmic-files puts its thumbnails.
dirs = { workspace = true }
libc = { workspace = true }
wgpu = { workspace = true }
# Only for `ffi::AVDRMFrameDescriptor`, the descriptor an import reads. No
# demuxing and no decoding happen here.
ffmpeg-next = { workspace = true }
# The three `iced::widget::shader` impls in src/widget.rs. Rust's coherence
# rules put them in the crate that owns the types, so the layer that draws
# the pass is also the layer that names iced. The shell stays in `kyerag`.
libcosmic = { workspace = true }
