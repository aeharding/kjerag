[package]
name = "kjerag-media"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Not released on its own: the workspace releases once, as the app crate
# (release.toml).
[package.metadata.release]
release = false

[dependencies]
cpal = { workspace = true }
# The `.insv` naming convention that says where a capture's other lens
# lives (issue #79). `meta` owns what an `.insv` is; this layer owns what a
# container is, and the pairing needs both halves.
kjerag-meta = { workspace = true }
ffmpeg-next = { workspace = true }
