[package]
name = "kyerag"
version.workspace = true
edition.workspace = true

[dependencies]
kyerag-render = { workspace = true }
# `xdg-portal` is the portal file chooser and `about` is the About page.
# Neither is in libcosmic's default set, and features are additive with the
# workspace entry's `wgpu` (docs/UI.md).
libcosmic = { workspace = true, features = ["about", "xdg-portal"] }
open = { workspace = true }
serde = { workspace = true }
url = { workspace = true }
# Screenshots (issue #15): where a still goes, and what it is encoded as.
# Two encoders, because the file and the clipboard want different things:
# `jpeg-encoder` writes the file, `png` writes the paste.
dirs = { workspace = true }
jpeg-encoder = { workspace = true }
png = { workspace = true }
# The five second sleep a toast is taken away on. libcosmic's own toaster
# dismisses on exactly this (`src/widget/toaster/mod.rs:183-196`) and its
# `tokio` feature is in the default set we take, so this is the runtime the
# app already runs on rather than a second one.
tokio = { workspace = true }
