# The trailer layer. No ffmpeg and no wgpu, on purpose: this crate must
# build and test on a box with no libav headers (issue #19), which is what
# the `meta` job in .github/workflows/ci.yml proves on every push.
[package]
name = "kjerag-meta"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Not released on its own: the workspace releases once, as the app crate
# (release.toml).
[package.metadata.release]
release = false

[dependencies]
prost = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
