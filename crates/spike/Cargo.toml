# The M0 measuring instrument, kept out of the app's dependency graph: png
# and pollster exist for this binary alone.
[package]
name = "kyerag-spike"
version.workspace = true
edition.workspace = true

# `cargo run -p kyerag-spike` still means the measuring instrument, as every
# doc says it does, now that `reframe` is a second binary in this crate.
default-run = "spike"

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
kyerag-media = { workspace = true }
# The IMU track and the orientation it integrates to, which `gyro` reports
# on and `horizon` renders against (issue #8).
kyerag-meta = { workspace = true }
kyerag-render = { workspace = true }
ffmpeg-next = { workspace = true }
png = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
