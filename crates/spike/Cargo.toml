# The M0 measuring instrument, kept out of the app's dependency graph: png
# and pollster exist for this binary alone.
[package]
name = "kjerag-spike"
version.workspace = true
edition.workspace = true
publish.workspace = true

# `cargo run -p kjerag-spike` still means the measuring instrument, as every
# doc says it does, now that `reframe` is a second binary in this crate.
default-run = "spike"

# Not released on its own: the workspace releases once, as the app crate
# (release.toml).
[package.metadata.release]
release = false

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
kjerag-media = { workspace = true }
# The IMU track and the orientation it integrates to, which `gyro` reports
# on and `horizon` renders against (issue #8).
kjerag-meta = { workspace = true }
kjerag-render = { workspace = true }
ffmpeg-next = { workspace = true }
png = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }
# The two instruments and nothing else in the tree: the app reaches Wayland
# through libcosmic and never speaks it directly. `dragsource` (issue #118)
# performs a real drag, because a drop can only be tested by a second Wayland
# client; `src/bin/pointer.rs` (issue #126) moves and clicks, because wtype
# presses keys and nothing else in the harness can press anything. Every crate
# here is already in Cargo.lock through libcosmic, so the instruments add
# edges to the graph and no crate to the Flatpak's source list.
#
# `ashpd` is the portal client, for the half of a drop a sandboxed app can
# read: the file is registered with the document portal and the drag carries
# the key. libcosmic reads the key back with the same crate
# (`src/command.rs:66-72`), so both ends of the exchange are one library.
ashpd = { workspace = true }
# `poll` on the Wayland connection, so every wait in the instrument has an
# end: a check that hangs is worse than a check that fails.
libc = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time"] }
url = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client"] }
# The keyboard, which a drop turns out to need: libcosmic creates the
# `wl_data_device` a drag is delivered over only while the seat has a keyboard
# capability (smithay-clipboard `src/state.rs:323-333`), and a headless
# session has no input devices at all. The instrument holds one open so the
# target has somewhere to receive the drag.
wayland-protocols-misc = { workspace = true, features = ["client"] }
# The pointer, for the same reason: the button the drag is started from comes
# from the virtual pointer protocol, which is the one cage offers
# (`wlr_virtual_pointer_manager_v1_create`). It is also all `pointer` binds,
# beside wayland-client.
wayland-protocols-wlr = { workspace = true, features = ["client"] }
