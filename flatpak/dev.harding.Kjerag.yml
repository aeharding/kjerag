# Flatpak manifest. Reasoning and measurements are in docs/DISTRIBUTION.md;
# this file only says what.
#
# Build it. No step touches the network: every crate is a declared source in
# cargo-sources.json, generated from Cargo.lock by scripts/cargo-sources.sh
# and committed (issue #72).
#
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       --state-dir=scratch/flatpak-builder \
#       scratch/flatpak-build flatpak/dev.harding.Kjerag.yml
#
# --state-dir is not decoration. The builder's cache defaults to
# .flatpak-builder in the working directory, which for this manifest is the
# repository root, and the `dir` source below copies the whole repository into
# the build: the default leaves 1.7 GB of cache beside the source and then
# copies it into the next build of itself. scratch/ is skipped and gitignored.
app-id: dev.harding.Kjerag
runtime: org.freedesktop.Platform
# 25.08, not 24.08: libcosmic needs rustc 1.93 and the rust-stable extension
# is 1.89.0 on 24.08, 1.97.1 on 25.08 (measured). Its ffmpeg is 7.1.3, which
# is the major the workspace pins (issue #65).
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # ffmpeg-sys-next runs bindgen, which needs libclang. The SDK has none.
  - org.freedesktop.Sdk.Extension.llvm21
command: kjerag

finish-args:
  # A COSMIC app. No X11 socket: the frame path is Wayland dmabuf and has
  # never been run under Xwayland, so claiming it would be a guess.
  - --socket=wayland
  # The GPU, which is both halves of the pipeline: VA-API decode through
  # /dev/dri/renderD128 and the Vulkan device wgpu imports the dmabuf onto.
  - --device=dri
  # cpal links ALSA, and the runtime's /etc/alsa/conf.d/99-pulseaudio-default.conf
  # makes ALSA's `default` device the pulse plugin, which this socket carries.
  # Measured playing real footage in the sandbox: 0 underruns.
  - --socket=pulseaudio
  # cosmic-config deliberately escapes the sandbox and reads and writes the
  # HOST's ~/.config/cosmic and ~/.local/state/cosmic, so both have to be
  # granted by name. Without the second one every run logs "saved state not
  # saved: Read-only file system" (measured) and nothing is remembered.
  - --filesystem=xdg-config/cosmic
  - --filesystem=~/.local/state/cosmic
  - --talk-name=com.system76.CosmicSettingsDaemon
  - --talk-name=com.system76.CosmicSettingsDaemon.Config.*
  # Where a saved still goes (crates/app/src/shot.rs). Without this the file
  # lands inside the sandbox's private home and the pilot never finds it.
  - --filesystem=xdg-pictures
  # Read-only access to the videos folder, which is where a 360 camera's
  # footage is copied and the only folder this player reads from (issue #118).
  #
  # It is here because a bare path is still how most files arrive. A drop
  # carries a document portal key only if the source registered the files with
  # the portal, and cosmic-files 1.5.0 does not: it offers `text/uri-list` and
  # nothing else (checked in its source and in the shipped binary, which does
  # not contain the string `vnd.portal`). So a drag out of the COSMIC file
  # manager, `kjerag ~/Videos/flight.insv` on a terminal and a double click on
  # a `.insv` all hand over a path on the host filesystem, and without this
  # line every one of them is a file the sandbox cannot see. The portal arm is
  # still there and still preferred, and the day cosmic-files registers its
  # drags this line can be reconsidered.
  #
  # `:ro` because the player never writes to footage, and `xdg-videos` rather
  # than `home` or `host` because a wider grant would not buy anything: a file
  # anywhere else is one `File > Open video...` away, through the portal, at
  # no permission at all.
  - --filesystem=xdg-videos:ro
  # No other filesystem access on purpose: anything outside the videos folder
  # arrives through the file chooser portal, or as a document-portal path from
  # a source that registered it.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib
    # /run/build/<module-name>/cargo, and the module below has to keep that
    # name. cargo reads $CARGO_HOME/config, cargo-sources.json writes one
    # into exactly that directory, and anywhere else the file is written and
    # never read and the build dies with "you are in the offline mode".
    CARGO_HOME: /run/build/kjerag/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: kjerag
    buildsystem: simple
    build-commands:
      - cargo build --release --offline --locked
      - install -Dm0755 target/release/kjerag /app/bin/kjerag
      - install -Dm0644 resources/dev.harding.Kjerag.desktop
        /app/share/applications/dev.harding.Kjerag.desktop
      - install -Dm0644 resources/dev.harding.Kjerag.metainfo.xml
        /app/share/metainfo/dev.harding.Kjerag.metainfo.xml
      - install -Dm0644 resources/dev.harding.Kjerag.xml
        /app/share/mime/packages/dev.harding.Kjerag.xml
      # The icon theme tree, copied whole rather than listed size by size: it
      # is generated (resources/icons/README.md), so a list written here goes
      # stale the first time a size moves.
      #
      # flatpak exports an icon to the host only when its basename starts
      # with the app ID, which since issue #75 these do: basename, app ID and
      # the entry's Icon= key are one string. The export was last measured
      # before that (docs/DISTRIBUTION.md 2.4), when it warned and a host
      # launcher showed a placeholder.
      - install -d /app/share/icons
      - cp -r resources/icons/hicolor /app/share/icons/
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .worktrees
          - scratch
          - target
      # One source per crate of Cargo.lock, which is what makes the build
      # offline. Regenerate it in any change that moves the lock file
      # (scripts/cargo-sources.sh, AGENTS.md). It covers the eleven git
      # dependencies and the [patch.crates-io] wgpu fork as well as
      # crates.io, because cargo has already resolved the patch into an
      # ordinary git source in the lock file.
      - cargo-sources.json
