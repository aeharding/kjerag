name: release
# A version tag is the whole trigger, and it has two outputs (issues #106,
# #137). One file a person can install, one per arch, on the GitHub Release:
# `flatpak install --user ./kjerag-….flatpak`. And the same build exported
# into the signed Flatpak repository at https://kjerag.harding.dev/, which is
# the one a person subscribes to and `flatpak update` follows.
#
# Every step is stock. The bundle is Flatpak's own action, running in the image
# Flathub builds with; the release is softprops/action-gh-release with the
# notes GitHub writes itself; the repository is andyholmes/flatter, signed with
# crazy-max/ghaction-import-gpg and pushed to the Pages branch by
# JamesIves/github-pages-deploy-action. Nothing here knows anything about this
# project that the manifest does not already say.
#
# The tag is the plain version, `0.1.0`, with no `v` in front of it (owner,
# 2026-08-01), and the pattern is the same statement: a digit-led tag starts a
# release, a tag named `test` or `nightly` starts nothing.
on:
  push:
    tags: ['[0-9]*']

# What the release step writes with. Everything else stays read-only.
permissions:
  contents: write

jobs:
  # The gates a pull request runs, on the tagged commit, by calling the same
  # workflow rather than restating it. It is what keeps a red commit from
  # becoming a published artifact.
  #
  # scripts/uitest.sh is not among them and cannot be: it decodes on VA-API
  # against /dev/dri/renderD128 and a runner has no GPU (AGENTS.md). It runs
  # on the way to the tag instead, out of release.toml.
  gates:
    uses: ./.github/workflows/ci.yml

  # One bundle per arch, each built on a runner of that arch: no emulation and
  # no cross build. The aarch64 half is compiled and unit tested and nothing
  # else, because a runner has no GPU (README, docs/RELEASING.md).
  bundle:
    needs: gates
    strategy:
      # One arch failing is not a reason to throw away the other's bundle.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # The image Flathub's own builds run in, on the runtime branch our
    # manifest names. It carries flatpak-builder and the two tools its last
    # steps need, `eu-strip` and gdk-pixbuf's SVG loader, which a bare runner
    # does not have and this job used to install by hand. The tag is
    # multi-arch: measured 2026-08-01 on ubuntu-24.04-arm, it starts and
    # reports `aarch64`, and the runtime and both SDK extensions the manifest
    # names exist on Flathub for aarch64.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      BUNDLE: kjerag-${{ github.ref_name }}-${{ matrix.arch }}.flatpak
    steps:
      - uses: actions/checkout@v4
      # Runs flatpak-builder against the committed manifest and
      # flatpak/cargo-sources.json, installs the runtime and the two SDK
      # extensions the manifest declares, and exports the single-file bundle
      # with the runtime repository recorded in it, so it installs on a
      # machine that has never had Flathub configured.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/dev.harding.Kjerag.yml
          bundle: ${{ env.BUNDLE }}
          # Not the host's arch: the action's own default is the string
          # `x86_64` (its action.yml), so the arm runner has to be told, or
          # flatpak-builder is asked for an x86_64 build on an arm machine.
          arch: ${{ matrix.arch }}
          # The Release is where the bundle goes; a second copy as a workflow
          # artifact would expire in 90 days and confuse which is which.
          upload-artifact: false
      - run: sha256sum "$BUNDLE" > "$BUNDLE.sha256"
      # Both arches publish into the one Release for the tag. Whichever runs
      # second finds it already created and adds its two files; the action
      # expects that ("presume a race with competing matrix runs",
      # src/github.ts).
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUNDLE }}
            ${{ env.BUNDLE }}.sha256
          generate_release_notes: true
          # A label after the version (0.1.0-rc1) is a prerelease, and GitHub
          # is told rather than left to guess.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # The other output of the tag: the signed OSTree repository the app is
  # installed and updated from (issue #137, docs/DISTRIBUTION.md 4.3). A
  # flatpak remote is a directory of static files, so this ends where a
  # GitHub Pages branch begins.
  #
  # It builds the manifest a second time rather than reusing the bundle above,
  # because a bundle is an export of a repository and not a repository: there
  # is no supported way back. Two builds per arch per tag is the price, and a
  # release-profile build inside the sandbox is about four minutes.
  pages:
    needs: gates
    strategy:
      # One repository, two arches, and they share its cache: the second job
      # restores what the first saved and adds to it, so what is deployed
      # carries both. That only holds while they do not run at once, which is
      # what max-parallel says (flatter's README, "Multiple Architectures").
      max-parallel: 1
      # An arch that fails is not a reason to throw away the other's build.
      # The deploy is the whole repository as the cache holds it, so whichever
      # arch succeeded is what gets published.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    # flatter's own image for Rust apps on this runtime branch: flatpak,
    # flatpak-builder, rsync for the deploy, and the freedesktop 25.08
    # Platform, Sdk and rust-stable already installed for BOTH arches, which
    # is what makes the same tag work on the arm runner. llvm21 is the one
    # thing the manifest names that the image does not carry, and
    # --install-deps-from below is what fetches it.
    container:
      image: ghcr.io/andyholmes/flatter/rust:25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # The signature is the whole reason a remote can be trusted over plain
      # HTTP. No secret, no key, no repository: this step fails the job rather
      # than publishing something a client would have to be told to ignore.
      - uses: crazy-max/ghaction-import-gpg@v7
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      # flatter reads ./CNAME to write the Url into the index.flatpakrepo it
      # generates, so the domain has to be here before the build and not only
      # in the deployed copy.
      - run: cp flatpak/pages/CNAME .
      - uses: andyholmes/flatter@main
        id: build
        with:
          files: flatpak/dev.harding.Kjerag.yml
          # The action's default is the string `x86_64`, so the arm runner has
          # to be told, exactly as the bundle job above is told.
          arch: ${{ matrix.arch }}
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          flatpak-builder-args: |
            --install-deps-from=flathub
      # What turns a directory of OSTree objects into something a person can
      # click: the repository's title, the two descriptor files, the landing
      # page and the icon. The script is the whole of that story and
      # .github/workflows/site.yml runs the same one against the published
      # repository, so a republish and a release describe the app alike.
      - name: Describe the repository
        run: >
          scripts/pages-site.sh
          "${{ steps.build.outputs.repository }}"
          "${{ steps.gpg.outputs.fingerprint }}"
      # The repository is the site, at the root of it, so the remote URL is
      # the bare domain. single-commit because the branch is an artifact and
      # not a history: every deploy replaces it whole.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ steps.build.outputs.repository }}
          single-commit: true
