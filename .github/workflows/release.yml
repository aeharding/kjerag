name: release
# One signed native build per architecture. Nothing is published until both
# handoffs authenticate and the complete repository/download payload is sealed.
# Release publishes first; a Pages failure leaves its valid downloads available
# and the old channel intact. Retry failed jobs using the same staged payload.
on:
  push:
    tags: ['[0-9]*']
  # Exercise the real native build and artifact handoff without publishing.
  # This route uses a disposable signer, never the production signing secrets.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  context:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      artifact-prefix: ${{ steps.source.outputs.artifact-prefix }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          # Safe single-line step outputs here; Cargo and the final canonical
          # release record check the full semantic-version grammar.
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.+-]+)?$ ]]
          case "$EVENT_NAME" in
            push)
              test "$REF_TYPE" = tag
              test "$version" = "$REF_NAME"
              prefix=release
              ;;
            workflow_dispatch)
              # Keep disposable-signature build caches off release tags and
              # the default branch used as a fallback by production builds.
              test "$REF_TYPE" = branch
              test "$REF_NAME" != "$DEFAULT_BRANCH"
              prefix=validation
              ;;
            *) exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact-prefix=$prefix" >> "$GITHUB_OUTPUT"
      - name: Create a disposable validation signer
        if: github.event_name == 'workflow_dispatch'
        run: |
          export GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/validation-key.XXXXXXXX")"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key \
            "Kjerag validation $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT <validation@example.invalid>" rsa2048 sign 1d
          mkdir validation-key
          gpg --batch --armor --export-secret-keys > validation-key/disposable.asc
          test -s validation-key/disposable.asc
          gpgconf --kill gpg-agent
      # This is a publicly disposable test key, not a production secret. Only
      # this run's validation jobs use it. Never include it in either payload.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: validation-key
          path: validation-key/disposable.asc
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  gates:
    needs: context
    uses: ./.github/workflows/ci.yml

  build:
    needs: [context, gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/andyholmes/flatter/rust:25.08
      options: --privileged
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.context.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate the native source checkout
        run: |
          test "$(uname -m)" = "$RELEASE_ARCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(awk -F '\"' '/^version = / { print $2; exit }' Cargo.toml)" = "$RELEASE_VERSION"
      - uses: crazy-max/ghaction-import-gpg@v7
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: validation-key
          # The manifest's dir source copies the checkout. Keep even the
          # disposable private key outside build sources and cached debug data.
          path: ${{ runner.temp }}/validation-key
      - name: Select this run's signer
        id: signer
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            export GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/validation-signing.XXXXXXXX")"
            echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
            gpg --batch --import "$RUNNER_TEMP/validation-key/disposable.asc"
            fingerprint=$(gpg --batch --with-colons --list-secret-keys validation@example.invalid | awk -F: '$1 == "fpr" { print $10; exit }')
          else
            fingerprint=$PRODUCTION_FINGERPRINT
          fi
          [[ $fingerprint =~ ^[0-9A-Fa-f]{40}$ ]]
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - run: cp flatpak/pages/CNAME .
      - uses: andyholmes/flatter@main
        id: build
        with:
          files: flatpak/dev.harding.Kjerag.yml
          arch: ${{ matrix.arch }}
          gpg-sign: ${{ steps.signer.outputs.fingerprint }}
          flatpak-builder-args: |
            --install-deps-from=flathub
      - name: Stage this architecture's signed commits
        env:
          BUILD_REPOSITORY: ${{ steps.build.outputs.repository }}
          FINGERPRINT: ${{ steps.signer.outputs.fingerprint }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/release-artifacts.sh stage "$BUILD_REPOSITORY" \
            "release-$RELEASE_ARCH" "$RELEASE_ARCH" "$RELEASE_VERSION" "$GITHUB_SHA" "$FINGERPRINT"
      # Named handoffs, never matrix order or shared-cache contents. Upload the
      # staged repository and provenance only, never builder state or GPG home.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.context.outputs.artifact-prefix }}-${{ matrix.arch }}
          path: release-${{ matrix.arch }}/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14

  assemble:
    needs: [context, build]
    runs-on: ubuntu-24.04
    outputs:
      fingerprint: ${{ steps.signer.outputs.fingerprint }}
      public-key: ${{ steps.trust.outputs.public-key }}
    env:
      RELEASE_VERSION: ${{ needs.context.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree gnupg
      - uses: crazy-max/ghaction-import-gpg@v7
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: validation-key
          path: ${{ runner.temp }}/validation-key
      - name: Select this run's signer
        id: signer
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRODUCTION_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            export GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/validation-signing.XXXXXXXX")"
            echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
            gpg --batch --import "$RUNNER_TEMP/validation-key/disposable.asc"
            fingerprint=$(gpg --batch --with-colons --list-secret-keys validation@example.invalid | awk -F: '$1 == "fpr" { print $10; exit }')
          else
            fingerprint=$PRODUCTION_FINGERPRINT
          fi
          [[ $fingerprint =~ ^[0-9A-Fa-f]{40}$ ]]
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.context.outputs.artifact-prefix }}-x86_64
          path: staging/release-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.context.outputs.artifact-prefix }}-aarch64
          path: staging/release-aarch64
      - name: Assemble and describe the single signed repository
        env:
          FINGERPRINT: ${{ steps.signer.outputs.fingerprint }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/release-artifacts.sh assemble staging assembled "$RELEASE_VERSION" "$GITHUB_SHA" "$FINGERPRINT"
          bash scripts/pages-site.sh assembled/repository "$FINGERPRINT"
          export FLATPAK_USER_DIR="$(mktemp -d "$RUNNER_TEMP/release-client.XXXXXXXX")"
          flatpak remote-add --user --gpg-import=assembled/signing-key.gpg \
            release "file://$PWD/assembled/repository"
          while read -r ref expected; do
            arch=$(printf '%s' "$ref" | cut -d/ -f3)
            test "$(flatpak remote-info --user --arch="$arch" --show-commit release "$ref")" = "$expected"
          done < assembled/commits.txt
          bash scripts/release-artifacts.sh seal assembled "$RELEASE_VERSION" "$GITHUB_SHA" "$FINGERPRINT"
          bash scripts/release-artifacts.sh verify assembled "$RELEASE_VERSION" "$GITHUB_SHA" "$FINGERPRINT"
          python3 scripts/check-release-channel.py assembled/not-published-yet assembled/release.txt
      # Trust comes from this job, not a key chosen by the downloaded artifact.
      - id: trust
        env:
          FINGERPRINT: ${{ steps.signer.outputs.fingerprint }}
        run: echo "public-key=$(gpg --batch --export "$FINGERPRINT" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.context.outputs.artifact-prefix }}-publication
          path: |
            assembled/repository/
            assembled/bundles/
            assembled/commits.txt
            assembled/release.txt
            assembled/payload.sha256
            assembled/payload.sig
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 14

  github-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: kjerag-release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
      FINGERPRINT: ${{ needs.assemble.outputs.fingerprint }}
      RELEASE_PUBLIC_KEY: ${{ needs.assemble.outputs.public-key }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-publication
          path: assembled
      - name: Authenticate the complete staged publication
        run: |
          export GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/release-trust.XXXXXXXX")"
          printf '%s' "$RELEASE_PUBLIC_KEY" | base64 --decode | gpg --batch --import
          bash scripts/release-artifacts.sh verify assembled "$RELEASE_VERSION" "$GITHUB_SHA" "$FINGERPRINT"
      - name: Publish downloads without replacing divergent assets
        run: python3 scripts/publish-release-assets.py "$RELEASE_VERSION" "$GITHUB_SHA" assembled/bundles

  pages:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [assemble, github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Lock before reading gh-pages; site.yml uses the same group.
    concurrency:
      group: kjerag-pages-production
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
      FINGERPRINT: ${{ needs.assemble.outputs.fingerprint }}
      RELEASE_PUBLIC_KEY: ${{ needs.assemble.outputs.public-key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - uses: actions/download-artifact@v4
        with:
          name: release-publication
          path: assembled
      - name: Authenticate payload and refuse a stale channel replacement
        run: |
          export GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/release-trust.XXXXXXXX")"
          printf '%s' "$RELEASE_PUBLIC_KEY" | base64 --decode | gpg --batch --import
          bash scripts/release-artifacts.sh verify assembled "$RELEASE_VERSION" "$GITHUB_SHA" "$FINGERPRINT"
          python3 scripts/check-release-channel.py published/kjerag-release.txt assembled/release.txt
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: assembled/repository
          single-commit: true

  validate-handoff:
    if: github.event_name == 'workflow_dispatch'
    needs: [context, assemble]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.context.outputs.version }}
      FINGERPRINT: ${{ needs.assemble.outputs.fingerprint }}
      RELEASE_PUBLIC_KEY: ${{ needs.assemble.outputs.public-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: validation-publication
          path: assembled
      - name: Authenticate the final downloaded validation artifact
        run: |
          export GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/validation-trust.XXXXXXXX")"
          printf '%s' "$RELEASE_PUBLIC_KEY" | base64 --decode | gpg --batch --import
          bash scripts/release-artifacts.sh verify assembled "$RELEASE_VERSION" "$GITHUB_SHA" "$FINGERPRINT"
