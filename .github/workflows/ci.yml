name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this one on the tagged commit, so a release
  # runs the gates a pull request runs and there is one copy of them.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ffmpeg-sys-next binds the system headers, and bindgen needs libclang
      # to read them. The pin is ffmpeg 7.1 (issue #65) and ubuntu-24.04 ships
      # 6.1, so the ffmpeg half comes from a PPA, and it is the same one
      # AGENTS.md gives the dev box: CI and a developer bind the same headers.
      # The second to last line is libcosmic's: drm-sys and
      # wayland-sys pkg-config for libdrm and wayland-client, and the
      # xkbcommon crate links libxkbcommon. The last is cpal's, which the sound
      # goes out through (issue #13); no device is opened in CI, but the crate
      # links alsa on Linux whichever host it uses.
      - run: |
          sudo add-apt-repository -y ppa:ubuntuhandbook1/ffmpeg7
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev \
            libavutil-dev libpostproc-dev libswresample-dev libswscale-dev \
            libclang-dev \
            libdrm-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev
      # Headers that are not 7.x fail thirty lines deep inside ffmpeg-next
      # (issue #65 measured them), which reads as the dependency being broken
      # rather than the runner holding the wrong ffmpeg. Say which it is.
      - run: |
          major=$(pkg-config --modversion libavcodec | cut -d. -f1)
          test "$major" = 61 || {
            echo "libavcodec $major, wanted 61 (ffmpeg 7.1): the PPA did not take"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # A change to Cargo.lock is a change to flatpak/cargo-sources.json, and two
  # branches that each do one half of that merge clean into a main where they
  # disagree, which is how the Flatpak build broke on 2026-07-31. The check
  # needs no network and no toolchain: it compares the lock file's packages
  # against the sources the committed file declares.
  cargo-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/cargo-sources.sh --check

  # The name the project had before issue #75 is gone and stays gone, in file
  # contents and in paths (owner). Needs no toolchain: it is a grep over what
  # git tracks, and the pattern is written so the script does not match
  # itself.
  name-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/name-check.sh

  # The metainfo is the changelog a software centre shows and the file
  # Flathub reads hardest, and cargo-release stamps a <release> entry into it
  # on every release (release.toml, issue #106). Checked on every pull request
  # rather than at the tag, because a tag that fails here fails on something
  # that was true days earlier.
  metainfo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream
      - run: appstreamcli validate resources/dev.harding.Kjerag.metainfo.xml

  # The point of the workspace (issue #19): the trailer layer builds and
  # tests on a box with no libav headers. This job installs nothing, so it
  # fails the day something drags ffmpeg into kjerag-meta's graph.
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # pkg-config is pointed at nothing as well, so this job still fails on a
      # runner image that happens to ship libav headers. Verified positively:
      # the same environment fails `cargo check -p kjerag-media` on
      # `libavutil.pc` not found.
      - run: PKG_CONFIG_LIBDIR=/nonexistent cargo test -p kjerag-meta
